    <script>
      // Suppress unhandled WebSocket/HMR or GSI origin notices
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason.message === 'string' && (
            event.reason.message.includes('WebSocket') ||
            event.reason.message.includes('vite') ||
            event.reason.message.includes('HMR') ||
            event.reason.message.includes('origin is not allowed') ||
            event.reason.message.includes('GSI_LOGGER')
          ))
        )) {
          event.preventDefault();
        }
      });

      // Filter GSI origin notice from console.error in preview environments
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (typeof arguments[i] === 'string' && (
              arguments[i].includes('[GSI_LOGGER]') ||
              arguments[i].includes('The given origin is not allowed') ||
              arguments[i].includes('origin is not allowed for the given client ID')
            )) {
              console.info('[GSI Notice]: Origin configuration notice:', arguments[i]);
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
